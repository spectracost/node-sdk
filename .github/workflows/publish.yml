name: Publish to npm

# This workflow runs INSIDE the public spectracost/node-sdk repo after
# the sync bot pushes a new v* tag. It publishes to npm via Trusted
# Publishing (OIDC), so no long-lived NPM_TOKEN secret is needed.
#
# Prerequisite: spectracost on npm must be configured with a trusted
# publisher pointing at spectracost/node-sdk + publish.yml (configured
# once at https://www.npmjs.com/package/spectracost/access).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships with npm 11.x which supports Trusted Publishing
          # (OIDC auto-exchange in npm publish). Node 22 ships npm 10.x
          # and in-place upgrades via corepack/npm-install-g don't cleanly
          # swap the active binary.
          node-version: "24"
          # Intentionally NOT setting registry-url: it causes setup-node
          # to write a placeholder .npmrc with a bogus _authToken that
          # npm Trusted Publishing then tries (and fails) to use.

      - name: Check npm supports Trusted Publishing
        run: |
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance (Trusted Publishing)
        run: npm publish --provenance --access public
